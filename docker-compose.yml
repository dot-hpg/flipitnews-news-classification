services:
  api:
    build: .
    image: flipitnews:1.0
    ports:
      - "8000:8000"
    restart: unless-stopped

  app:
    image: flipitnews:1.0
    depends_on:
      - api
    command: ["streamlit", "run", "streamlit_app.py", "--server.port", "8501", "--server.address", "0.0.0.0",
              "--server.headless", "true"]
    ports:
      - "8501:8501"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=4)"]
    restart: unless-stopped
