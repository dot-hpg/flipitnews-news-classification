name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m nltk.downloader stopwords punkt_tab wordnet averaged_perceptron_tagger_eng
      - name: Retrain from the raw CSV (checks the training pipeline end to end)
        run: python scripts/train.py
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t flipitnews:ci .
      - name: Smoke-test the API container
        run: |
          docker run -d --name api -p 8000:8000 flipitnews:ci
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 2; done
          curl -sf -X POST localhost:8000/predict -H "Content-Type: application/json" \
               -d '{"texts":["The striker scored twice as the team won the cup final."]}' | tee out.json
          grep -q '"category":"Sports"' out.json
